name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.2.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating GitHub releases
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
          exit 1
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Restore dependencies
      run: |
        dotnet restore FlintsLabs.D365.ODataClient.Tests/FlintsLabs.D365.ODataClient.Tests.csproj
        dotnet restore samples/FlintsLabs.D365.ODataClient.V2.Examples/FlintsLabs.D365.ODataClient.V2.Examples.csproj

    - name: Test net8.0
      run: dotnet test FlintsLabs.D365.ODataClient.Tests/FlintsLabs.D365.ODataClient.Tests.csproj -c Release -f net8.0 --no-restore --filter "Category!=Integration" -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Test net10.0
      run: dotnet test FlintsLabs.D365.ODataClient.Tests/FlintsLabs.D365.ODataClient.Tests.csproj -c Release -f net10.0 --no-restore --filter "Category!=Integration" -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Build compiled examples
      run: dotnet build samples/FlintsLabs.D365.ODataClient.V2.Examples/FlintsLabs.D365.ODataClient.V2.Examples.csproj -c Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Build package targets
      run: dotnet build FlintsLabs.D365.ODataClient/FlintsLabs.D365.ODataClient.csproj -c Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Pack
      run: dotnet pack FlintsLabs.D365.ODataClient/FlintsLabs.D365.ODataClient.csproj -c Release --no-build -o ./nupkg -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Inspect package contents
      run: unzip -l ./nupkg/FlintsLabs.D365.ODataClient.${{ steps.get_version.outputs.VERSION }}.nupkg

    - name: Publish to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./nupkg/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
